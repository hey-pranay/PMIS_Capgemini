# Optional: throw-away MySQL 8 for local development
#   docker compose up -d
# Credentials below match the defaults in application.properties.
services:
  mysql:
    image: mysql:8.0
    container_name: placement-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: placement_portal
    ports:
      - "3306:3306"
    volumes:
      - placement-mysql-data:/var/lib/mysql

volumes:
  placement-mysql-data:
