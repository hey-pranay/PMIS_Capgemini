spring.application.name=placement-portal
spring.main.banner-mode=off

# ---- MySQL connection (override with environment variables DB_URL / DB_USERNAME / DB_PASSWORD) ----
# createDatabaseIfNotExist=true -> the 'placement_portal' schema is created automatically on first run.
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

logging.level.root=WARN
logging.level.com.university.placement=INFO


# ===================================
# JPA / Hibernate Configuration
# ===================================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true



# ===================================
# Error Configuration
# ===================================
spring.web.error.include-message=always